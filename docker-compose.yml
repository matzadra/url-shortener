services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: shortener_db
    ports:
      - "5432:5432"
    networks:
      - shortener-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - shortener-network
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/shortener_db
    working_dir: /app
    command: npm run start:prod

volumes:
  postgres-data:

networks:
  shortener-network:
    driver: bridge
